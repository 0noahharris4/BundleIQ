services:
  - type: web
    name: bundleiq
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_DEBUG
        value: "0"
      - key: OPENAI_API_KEY
        sync: false  # set this in the Render dashboard -- keeps it out of the repo
